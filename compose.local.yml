name: ${COMPOSE_PROJECT_NAME:-${NAME_PREFIX:-app}}

# Local infrastructure only. Backend (air) and frontend (pnpm) run on the host
# via `make local-dev`. No dokploy-network.

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${NAME_PREFIX:-app}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: ${DB_NAME:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:8-alpine
    container_name: ${NAME_PREFIX:-app}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  # S3-compatible object store (master + volume + filer + S3 gateway in one
  # process). Identities come from S3_ACCESS_KEY / S3_SECRET_KEY; "anonymous"
  # may only read the app bucket so STORAGE_PUBLIC_BASE_URL works locally.
  # The API creates the bucket on startup (storage.BucketEnsurer).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: ${NAME_PREFIX:-app}-seaweedfs
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]},{"name":"anonymous","actions":["Read:%s"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" "$$S3_BUCKET" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024 \
          -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-storageadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-storageadmin}
      S3_BUCKET: ${S3_BUCKET:-app}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${SEAWEEDFS_UI_PORT:-8888}:8888"
    volumes:
      - storage_data:/data
    healthcheck:
      # /cluster/status answers 200 before raft elects a leader (a restart with
      # existing data takes ~1 min), so wait for IsLeader before the API starts.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status | grep -q '\"IsLeader\":true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    container_name: ${NAME_PREFIX:-app}-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - app

  adminer:
    image: adminer:4
    container_name: ${NAME_PREFIX:-app}-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks:
      - app

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: ${NAME_PREFIX:-app}-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-app-dev-meili-master-key-change-me}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # Use 127.0.0.1 — BusyBox wget resolves localhost to ::1; Meili listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: ${NAME_PREFIX:-app}-centrifugo
    restart: unless-stopped
    command: centrifugo -c config.json
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-app-centrifugo-api-key-change-me}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-app-centrifugo-token-hmac-change-me}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:3000 http://127.0.0.1:3000}
    ports:
      - "${CENTRIFUGO_PORT:-8000}:8000"
    volumes:
      - ./deploy/centrifugo/config.json:/centrifugo/config.json:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "centrifugo", "healthcheck", "--address=http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-${NAME_PREFIX:-app}-postgres}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-${NAME_PREFIX:-app}-redis}
  storage_data:
    name: ${STORAGE_VOLUME_NAME:-${NAME_PREFIX:-app}-seaweedfs}
  meili_data:
    name: ${MEILI_VOLUME_NAME:-${NAME_PREFIX:-app}-meilisearch}

networks:
  app:
    name: ${LOCAL_NETWORK_NAME:-${NAME_PREFIX:-app}}
    driver: bridge
