<!-- Source of frontend/public/landing/og.png: render at 1200x630 with headless Chrome (next to logo.svg = rentopya-logo-white.svg). -->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'Plus Jakarta Sans',sans-serif;color:#fff;background:#141527;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(60% 80% at 85% 10%,#5A62C4 0%,transparent 60%),
 radial-gradient(50% 70% at 100% 100%,#2E358C 0%,transparent 65%),
 radial-gradient(40% 60% at 10% 110%,#1D2160 0%,transparent 70%),#141527}
.grain{position:absolute;inset:0;opacity:.08;background-image:radial-gradient(#fff 0.6px,transparent 0.6px);background-size:4px 4px}
.wrap{position:relative;height:100%;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
img{height:84px;width:auto;align-self:flex-start;margin-left:-14px}
h1{font-size:68px;line-height:1.05;font-weight:700;letter-spacing:-0.025em;max-width:860px}
p{margin-top:22px;font-size:26px;color:rgba(255,255,255,.72);font-weight:500;max-width:820px;line-height:1.35}
.foot{display:flex;gap:14px}
.chip{font-size:18px;font-weight:600;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
</style></head><body><div class="bg"></div><div class="grain"></div>
<div class="wrap"><img src="logo.svg" alt="">
<div><h1>Filo, şube ve her kiralama tek panelde.</h1>
<p>Rezervasyondan sözleşmeye, teslimden iadeye, depozitodan faturaya.</p></div>
<div class="foot"><span class="chip">Çoklu şube</span><span class="chip">Rol bazlı yetki</span><span class="chip">Kendi alan adınızda rezervasyon sitesi</span></div>
</div></body></html>
